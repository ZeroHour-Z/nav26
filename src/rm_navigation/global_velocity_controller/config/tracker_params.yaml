global_velocity_controller:
  ros__parameters:
    # Path tracking
    lookahead_distance: 1.0  # 前瞻距离，兼顾陀螺稳定和近障反应
    target_speed: 0.45  # 降低目标速度，给实车制动留余量
    heading_kp: 1.0
    external_override_timeout: 0.2
    # Heading prediction factor (0.0~1.0)
    # 【关键】陀螺旋转时必须预测未来角度，设为2.0表示预测2个控制周期后的角度
    prediction_time_factor: 3.0

    enable_dynamic_lookahead: true  # 转弯/近路径变化时缩短前瞻，降低内切和冲障风险
    min_lookahead_distance: 0.5  # 最小前瞻
    max_lookahead_distance: 1.2  # 最大前瞻

    curvature_window_distance: 1.0
    curvature_low: 0.1
    curvature_high: 1.0

    # Goal handling / slow-down near goal
    slow_down_distance: 0.8
    min_target_speed: 0.03
    goal_position_tolerance: 0.15  # 放宽目标容差（配合 controller_params 中的 goal_decel_radius）
    goal_yaw_tolerance: 6.28
    final_heading_switch_distance: 0.3 
